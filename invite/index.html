:root{--ink:#30251d}
*{box-sizing:border-box}
html,body{margin:0;padding:0;overflow-x:hidden;background:#efe7db;color:var(--ink)}
html{scrollbar-gutter:stable}   /* the scrollbar's space is reserved even while the page is locked, so widths never change at hand-over */
body{font-family:'Cormorant Garamond',Georgia,serif;background-image:url('site-background.webp');background-repeat:repeat-y;background-position:center top;background-size:100% auto;background-attachment:scroll}
body.locked{height:100svh;overflow:hidden}
#opening{height:100svh;min-height:600px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;background:transparent}
/* The booklet is a gatefold: two cover doors hinged on the outer edges, meeting under the bow, with the
   first page waiting underneath. Tapping the bow swings both doors open towards the viewer, then the
   whole book scales and slides to the exact spot where the scroll's first page sits, and the scroll
   takes over. No filter on .scene, .cover3d or .leaf: a filter flattens 3D transforms. */
/* The book is laid out at the scroll page's final size and shown scaled DOWN while closed, so the
   zoom ends at scale(1): the browser never has to redraw it at a new size when the zoom finishes. */
.scene{position:relative;width:min(88vw,760px);aspect-ratio:2/3;perspective:1600px;perspective-origin:50% 50%;transform-origin:50% 50%;will-change:transform;flex:none}
.book-page{position:absolute;inset:0;filter:drop-shadow(0 20px 28px rgba(48,34,19,.14))}
.book-page img{display:block;width:100%;height:auto}
.cover3d{position:absolute;inset:0;transform-style:preserve-3d;transition:opacity .45s ease .95s}
.scene.is-opening .cover3d{opacity:0}
.leaf{position:absolute;top:0;bottom:0;width:50%;transform-style:preserve-3d;transition:transform 2.8s cubic-bezier(.55,.05,.35,1)}
/* The bow sits over the closed cover in three cut-outs. Tapping it pulls both loops through the knot,
   then the band, seal and tails drop away, and only then do the doors swing. */
.bow{position:absolute;inset:0;z-index:25;pointer-events:none}
.bow img{position:absolute;display:block;height:auto;filter:drop-shadow(0 6px 10px rgba(30,20,10,.35))}
.bow .loopL{left:.68%;top:33.2%;width:39.75%;transform-origin:100% 55%;transition:transform 1.5s cubic-bezier(.55,0,.85,.35),opacity .35s ease 1.2s}
.bow .loopR{left:60.25%;top:33.46%;width:39.06%;transform-origin:0 55%;transition:transform 1.5s cubic-bezier(.55,0,.85,.35),opacity .35s ease 1.2s}
.bow .rest{left:.68%;top:32.36%;width:98.73%;transform-origin:50% 25%;transition:transform 1.9s cubic-bezier(.45,0,.9,.45) 1.1s,opacity 1s ease 1.9s}
.scene.is-untying .loopL{transform:scaleX(.04) scaleY(.72);opacity:0}
.scene.is-untying .loopR{transform:scaleX(.04) scaleY(.72);opacity:0}
.scene.is-untying .rest{transform:translateY(115%) rotate(-6deg);opacity:0}
.leaf.l{left:0;transform-origin:left center}
.leaf.r{right:0;transform-origin:right center}
.scene.is-opening .leaf.l{transform:rotateY(-162deg)}
.scene.is-opening .leaf.r{transform:rotateY(162deg)}
.face{position:absolute;inset:0;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.front img{position:absolute;top:0;height:100%;width:200%;object-fit:contain;object-position:center;filter:drop-shadow(0 26px 32px rgba(42,28,16,.30))}
.leaf.l .face.front img{left:0}
.leaf.r .face.front img{left:-100%}
.face.back{transform:rotateY(180deg);background:linear-gradient(105deg,#e4d8c3 0%,#eee4d1 45%,#dcceb7 100%);box-shadow:inset 0 0 40px rgba(90,64,30,.18)}
.leaf.l .face.back{top:1.4%;bottom:1.4%;left:1.8%;right:0;border-radius:6px 0 0 6px}
.leaf.r .face.back{top:1.4%;bottom:1.4%;right:1.8%;left:0;border-radius:0 6px 6px 0}
.face.back:before{content:"";position:absolute;inset:7% 9%;border:1px solid rgba(139,106,53,.32)}
.bow-hotspot{position:absolute;left:30%;top:35%;width:40%;height:27%;border:0;background:transparent;cursor:pointer;z-index:30;touch-action:manipulation}
.opening-copy{position:absolute;left:0;right:0;bottom:2.2%;margin:0;text-align:center;white-space:nowrap;pointer-events:none;z-index:40}
.opening-copy .script,.opening-copy .hint{display:inline}
.opening-copy .sep{margin:0 .45em;color:#a8833e;font-size:clamp(14px,3.1vw,30px)}
@media(prefers-reduced-motion:reduce){.cover3d,.leaf,.scene,.bow img{transition:none!important}}

/* Each section is exactly one background tile tall (or an exact fraction of one, set by script as --sec),
   with the page centred in it, so the tile's join always falls in the gap between two pages. */
#invitation{display:none;position:relative;padding:0;background:transparent}
#invitation.visible{display:block}
.section{position:relative;min-height:var(--sec,100svh);display:flex;align-items:center;justify-content:center;padding:0 clamp(8px,4vw,56px);background:transparent}
.section-frame{width:min(88vw,760px);position:relative;filter:drop-shadow(0 20px 28px rgba(48,34,19,.14))}
.section-frame img{display:block;width:100%;height:auto;object-fit:contain;mix-blend-mode:multiply}

.section.tile-join:before{content:"";position:absolute;left:0;right:0;top:0;height:22px;transform:translateY(-50%);z-index:5;background:url('divider-marble.webp') center/auto 100% repeat-x;box-shadow:0 3px 8px rgba(30,20,10,.28),0 -1px 3px rgba(30,20,10,.15)}
.link-hotspot{position:absolute;display:block;z-index:50;border:0;background:transparent;cursor:pointer;pointer-events:auto;touch-action:manipulation;-webkit-tap-highlight-color:transparent}

/* Page-snap control: bottom right, shown once the scroll is live. */
.pager{position:fixed;right:12px;bottom:14px;z-index:900;display:none;flex-direction:column;gap:6px}
.pager.visible{display:flex}
.pager button{width:42px;height:42px;border-radius:50%;border:1px solid rgba(139,106,53,.7);background:rgba(239,228,210,.92);color:#6b5330;line-height:1;cursor:pointer;box-shadow:0 4px 14px rgba(30,20,10,.18);touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.pager button:disabled{opacity:.35;cursor:default}
.pager button svg{display:block;margin:auto;width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
/* Music control: mirrors the pager in the opposite corner, shown from the moment the bow is untied. */
.music-toggle{position:fixed;left:12px;bottom:14px;z-index:900;display:none;padding:0;width:42px;height:42px;border-radius:50%;border:1px solid rgba(139,106,53,.7);background:rgba(239,228,210,.92);color:#6b5330;line-height:1;cursor:pointer;box-shadow:0 4px 14px rgba(30,20,10,.18);touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.music-toggle.visible{display:block}
.music-toggle svg{display:block;margin:auto;width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.music-toggle .off{display:none}
.music-toggle.is-off .on{display:none}
.music-toggle.is-off .off{display:block}
/* When the invitation opens itself on the timer, the browser holds the music back until the guest
   touches the page, so the control breathes until it is tapped. */
.music-toggle.needs-tap{animation:musicPulse 2.4s ease-in-out infinite}
@keyframes musicPulse{0%,100%{box-shadow:0 4px 14px rgba(30,20,10,.18)}50%{box-shadow:0 4px 14px rgba(30,20,10,.18),0 0 0 7px rgba(168,131,62,.18)}}

<script>
const body=document.body, bow=document.getElementById('bowHotspot'), opening=document.getElementById('opening'), invitation=document.getElementById('invitation');
let opened=false;
let handedOver=false, openTimers=[], dropOpenResize=null;   // so the opening can be cut short mid way
const scene=document.getElementById('scene'), bookPage=document.getElementById('bookPage');
// Closed-book display size (the cover proportions from the original design), as a scale of the laid-out page size.
function coverScale(){
  const vw=window.innerWidth, vh=window.innerHeight, sw=scene.offsetWidth;
  const cw=vw<=700?Math.min(.88*vw,.74*vh*2/3):Math.min(.84*vw,540,.76*vh*2/3);
  return cw/sw;
}
scene.style.transform=`scale(${coverScale()})`;
window.addEventListener('resize',()=>{if(!opened)scene.style.transform=`scale(${coverScale()})`;});
function showScroll(fade){
  // The scroll's pages are blended into the background texture; the page inside the book is not,
  // so a hard cut shows as a tonal jump. Pin the book over the scroll and fade it out instead.
  if(fade){
    opening.style.position='fixed'; opening.style.inset='0'; opening.style.zIndex='200'; opening.style.pointerEvents='none';
  }else{ opening.style.display='none'; }
  invitation.classList.add('visible');
  body.classList.remove('locked');
  layoutSections();
  window.scrollTo(0,0);
  setFw(); fitOverlays();
  pager.classList.add('visible'); updatePager();
  if(fade){
    opening.style.transition='opacity 1.2s ease';
    requestAnimationFrame(()=>{opening.style.opacity='0';});
    setTimeout(()=>{opening.style.display='none';},1300);
  }
}
// Music. It starts with the bow and loops for as long as the invitation is open; the guest can silence it
// from the control in the bottom left corner.
const music=document.getElementById('music'), musicToggle=document.getElementById('musicToggle');
const MUSIC_VOLUME=0.55;
const MUSIC_DELAY=690;   // the bow unties in silence; the music comes in this long after the tap
const MUSIC_FADE=1600;   // and rises over this long, rather than arriving at full volume
let musicOn=false, musicFade=null, musicHeld=false;
function fadeMusic(to,ms,then){
  clearInterval(musicFade);
  const from=music.volume, steps=Math.max(1,Math.round(ms/40));
  let i=0;
  musicFade=setInterval(()=>{
    i++;
    music.volume=Math.min(1,Math.max(0,from+(to-from)*i/steps));
    if(i>=steps){clearInterval(musicFade);if(then)then();}
  },40);
}
function labelMusic(){
  musicToggle.classList.toggle('is-off',!musicOn);
  musicToggle.setAttribute('aria-pressed',musicOn?'true':'false');
  musicToggle.setAttribute('aria-label',musicOn?'Turn the music off':'Turn the music on');
}
// A page that opened on its own timer has had no user gesture, so the browser refuses to play. Wait for
// the first touch, tap or key anywhere and start then.
function gestureStart(e){
  if(e.target&&e.target.closest&&e.target.closest('#musicToggle'))return;   // the control handles its own taps
  playMusic();
}
function stopWaitingForGesture(){
  musicToggle.classList.remove('needs-tap');
  document.removeEventListener('pointerdown',gestureStart);
  document.removeEventListener('keydown',gestureStart);
}
function waitForGesture(){
  musicOn=false; labelMusic();
  musicToggle.classList.add('needs-tap');
  document.addEventListener('pointerdown',gestureStart);
  document.addEventListener('keydown',gestureStart);
}
function playMusic(){
  stopWaitingForGesture();
  clearInterval(musicFade);   // a fade-out still running would otherwise pause the track under us
  musicOn=true; labelMusic();
  music.volume=0;
  const p=music.play();
  if(p&&p.catch)p.catch(waitForGesture);
  if(!musicHeld)fadeMusic(MUSIC_VOLUME,MUSIC_FADE);
}
function pauseMusic(){
  stopWaitingForGesture();
  musicOn=false; labelMusic();
  fadeMusic(0,500,()=>music.pause());
}
musicToggle.addEventListener('click',()=>{musicOn?pauseMusic():playMusic();});
function startMusic(){
  musicToggle.classList.add('visible');
  // Safari only grants play() from inside the tap itself, so the track is started silently on the tap
  // and held there. The delay is counted from the tap, so the music lands with the bow.
  musicHeld=true;
  playMusic();
  setTimeout(()=>{
    musicHeld=false;
    if(!musicOn)return;
    // The volume is raised whether or not the file has begun yet. Waiting for it to be playing left
    // the track sitting at zero for good on anything slower than a local disk.
    if(!music.paused){try{music.currentTime=0;}catch(e){}}   // back to the first bar
    fadeMusic(MUSIC_VOLUME,MUSIC_FADE);
  },MUSIC_DELAY);
}
function openInvitation(e){
  if(e){e.preventDefault();e.stopPropagation();}
  if(opened)return; opened=true;
  startMusic();
  bow.style.display='none';
  document.querySelector('.opening-copy').style.visibility='hidden';   // keeps its space, so the book does not shift
  // The first page of the scroll, cloned into the book so the reveal shows the real page with its live text.
  const first=document.querySelector('#invitation .section-frame');
  bookPage.innerHTML=first.innerHTML;
  bookPage.style.setProperty('--fw',bookPage.offsetWidth+'px');   // layout width, unaffected by the scale
  fitOverlays();
  // Where will that page sit once the scroll is showing? Lay the scroll out for a moment, measure,
  // and express the zoom as a translate+scale of the scene onto that rectangle.
  const zoomTransform=()=>{
    window.scrollTo(0,0);
    const prev=scene.style.transform; scene.style.transform='';
    const s=scene.getBoundingClientRect();
    // the target is measured in the unlocked layout, scrollbar included, exactly as the scroll will show it
    opening.style.display='none'; invitation.classList.add('visible'); invitation.style.visibility='hidden'; body.classList.remove('locked');
    layoutSections();                       // section heights follow the unlocked width, same as after hand-over
    const t=first.getBoundingClientRect();
    body.classList.add('locked'); invitation.style.visibility=''; invitation.classList.remove('visible'); opening.style.display='';
    scene.style.transform=prev;
    const k=t.width/s.width, dx=(t.left+t.width/2)-(s.left+s.width/2), dy=(t.top+t.height/2)-(s.top+s.height/2);
    return `translate(${dx}px,${dy}px) scale(${k})`;
  };
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){handOver(false);return;}
  // Timeline (ms): 0 bow unties, 1100 ribbon drops, 2600 doors swing (2.8s), 4900 zoom (4.2s), 9200 scroll.
  scene.classList.add('is-untying');
  openTimers.push(setTimeout(()=>scene.classList.add('is-opening'),2600));
  let zooming=false;
  const onResize=()=>{if(zooming)scene.style.transform=zoomTransform();};
  window.addEventListener('resize',onResize);
  dropOpenResize=()=>window.removeEventListener('resize',onResize);
  openTimers.push(setTimeout(()=>{
    zooming=true;
    const target=zoomTransform();
    scene.style.transition='transform 4.2s cubic-bezier(.42,0,.58,1)';
    scene.getBoundingClientRect();            // commit the transition before the transform changes, so it always animates
    scene.style.transform=target;
  },4900));
  openTimers.push(setTimeout(()=>handOver(true),9200));
}
// The scroll is only ever reached through here, so whatever is still pending can be dropped first.
function handOver(fade){
  if(handedOver)return; handedOver=true;
  openTimers.forEach(clearTimeout); openTimers=[];
  if(dropOpenResize){dropOpenResize();dropOpenResize=null;}
  showScroll(fade);
}
// Tapping again while the book is opening skips the rest of it, for anyone who has seen it already.
function skipOpening(e){
  if(!opened||handedOver)return;
  if(e){e.preventDefault();e.stopPropagation();}
  handOver(false);
}
opening.addEventListener('pointerup',skipOpening);
opening.addEventListener('click',skipOpening);
opening.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' ')skipOpening(e);});

// Page snapping: the arrows (and the keyboard) glide to the previous/next page; free scrolling still works.
const pager=document.getElementById('pager'), pagePrev=document.getElementById('pagePrev'), pageNext=document.getElementById('pageNext');
const sections=[...document.querySelectorAll('#invitation .section')];
function currentPage(){
  const mid=window.scrollY+window.innerHeight/2;
  let best=0, dist=Infinity;
  sections.forEach((s,i)=>{const r=s.getBoundingClientRect();const c=window.scrollY+r.top+r.height/2;const d=Math.abs(c-mid);if(d<dist){dist=d;best=i;}});
  return best;
}
const SNAP_GAP=0.20, SNAP_GAP_MIN=0.04;   // the page top lands between 4% and 20% of the window height below the top edge
function goToPage(i){
  i=Math.max(0,Math.min(sections.length-1,i));
  const r=sections[i].querySelector('.section-frame').getBoundingClientRect();
  // never lower than centred (a short page on a tall window stays in the middle), never flush with the edge
  const centred=(window.innerHeight-r.height)/2;
  const gap=Math.min(window.innerHeight*SNAP_GAP, Math.max(window.innerHeight*SNAP_GAP_MIN, centred));
  const top=window.scrollY+r.top-gap;
  window.scrollTo({top:Math.max(0,top),behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});
}
function updatePager(){const i=currentPage();pagePrev.disabled=i<=0;pageNext.disabled=i>=sections.length-1;}
pagePrev.addEventListener('click',()=>goToPage(currentPage()-1));
pageNext.addEventListener('click',()=>goToPage(currentPage()+1));
window.addEventListener('scroll',()=>{if(pager.classList.contains('visible'))updatePager();},{passive:true});
document.addEventListener('keydown',e=>{
  if(!pager.classList.contains('visible')||e.target.closest('input,textarea,button,a'))return;
  if(e.key==='ArrowDown'||e.key==='PageDown'||e.key===' '){e.preventDefault();goToPage(currentPage()+1);}
  if(e.key==='ArrowUp'||e.key==='PageUp'){e.preventDefault();goToPage(currentPage()-1);}
});

// Live countdown: switched on from 13 September 2025 and counts down to the ceremony,
// 2 October 2026 at 11:00 AM in Rome (Europe/Rome).
const start=Date.parse('2025-09-13T00:00:00+02:00');
const target=Date.parse('2026-10-02T11:00:00+02:00');
const units=[document.getElementById('days'),document.getElementById('hours'),document.getElementById('minutes'),document.getElementById('seconds')];
function updateCountdown(){
  const now=Date.now();
  if(now<start){units.forEach(u=>u.classList.add('hidden'));return;}
  units.forEach(u=>u.classList.remove('hidden'));
  let diff=Math.max(0,target-now);
  const d=Math.floor(diff/86400000); diff-=d*86400000;
  const h=Math.floor(diff/3600000); diff-=h*3600000;
  const m=Math.floor(diff/60000); diff-=m*60000;
  const s=Math.floor(diff/1000);
  [d,h,m,s].forEach((v,i)=>units[i].textContent=String(v).padStart(2,'0'));
}

const langToggle=document.getElementById('langToggle');

function applyLang(l){
  lang=I18N[l]?l:'en';
  document.documentElement.lang=lang;
  document.querySelectorAll('[data-i18n]').forEach(el=>{el.innerHTML=I18N[lang][el.dataset.i18n]??'';});
  langToggle.textContent=I18N[lang].toggle; langToggle.setAttribute('aria-label',I18N[lang].toggleAria);
  try{localStorage.setItem('inviteLang',lang);}catch(e){}
  fitOverlays();
}
langToggle.addEventListener('click',()=>applyLang(lang==='en'?'es':'en'));
// Choosing a language on the first page is also the guest saying they are ready, so carry them on to
// the next page, the same glide the arrow gives. The toggle in the corner only changes the language.

  applyLang(b.dataset.setlang);
  requestAnimationFrame(()=>goToPage(currentPage()+1));   // after the new wording has been laid out
}));
let initial=new URLSearchParams(location.search).get('lang');
if(!initial){try{initial=localStorage.getItem('inviteLang');}catch(e){}}
if(!initial&&/^es\b/i.test(navigator.language||''))initial='es';

// Overlay sizes follow the rendered frame width.
const frames=document.querySelectorAll('.section-frame');
const setFw=()=>frames.forEach(f=>f.style.setProperty('--fw',f.getBoundingClientRect().width+'px'));

// Section height = background tile height / n, where n keeps the gap between pages comfortable.
// The desktop tile is the background image at 100% width (951x1654); on phones the CSS handles it.
const BG_RATIO=1654/951;
function layoutSections(){
  if(matchMedia('(max-width:700px)').matches){invitation.style.removeProperty('--sec');markJoins(1);return;}
  const T=document.documentElement.clientWidth*BG_RATIO;
  const fh=Math.min(.88*document.documentElement.clientWidth,760)*1.5;     // page height: the artwork is 2:3
  let n=Math.max(1,Math.round(T/(fh*1.3)));
  while(n>1&&T/n<fh*1.08)n--;
  const v=(T/n).toFixed(2)+'px';
  if(invitation.style.getPropertyValue('--sec')!==v)invitation.style.setProperty('--sec',v);
  markJoins(n);
}
// the background repeats every n sections: only those boundaries get the marble band
function markJoins(n){sections.forEach((s,i)=>s.classList.toggle('tile-join',i>0&&i%n===0));}
layoutSections();
new ResizeObserver(()=>{requestAnimationFrame(()=>{layoutSections();setFw();fitOverlays();});}).observe(document.body); setFw();

// Border guard: no overlay line may cross the page border, whatever font or language is in play.
// A line whose box reaches past 97.5% of the frame width (or before 2.5%) is scaled down until it fits.
function fitOverlays(){
  document.querySelectorAll('.section-frame, .book-page').forEach(f=>{
    const fr=f.getBoundingClientRect(); if(!fr.width)return;
    const lo=fr.left+fr.width*.025, hi=fr.left+fr.width*.975;
    f.querySelectorAll('.ov > *').forEach(el=>{
      el.style.fontSize='';
      let r=el.getBoundingClientRect(), tries=0;
      while((r.right>hi||r.left<lo)&&tries<12){
        el.style.fontSize=(parseFloat(getComputedStyle(el).fontSize)*.94)+'px';
        r=el.getBoundingClientRect(); tries++;
      }
    });
  });
}
fitOverlays();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fitOverlays);

// tuner.html loads the invitation as index.html#tune, which skips the book and the music and hands
// straight over to the scroll so the text can be positioned. It does nothing for a guest.
if(location.hash==='#tune'){opened=true;handOver(false);}
window.fitOverlays=fitOverlays;
